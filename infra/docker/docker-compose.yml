# Ambiente local do PG Delivery: docker compose up -d
services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: pg
      POSTGRES_PASSWORD: pg
      POSTGRES_DB: pgdelivery
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pg -d pgdelivery"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["6379:6379"]

  # Redpanda: compatível com a API do Kafka, leve para desenvolvimento
  kafka:
    image: redpandadata/redpanda:v24.2.7
    command:
      - redpanda start --overprovisioned --smp 1 --memory 1G --reserve-memory 0M --node-id 0 --check=false
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr internal://kafka:9092,external://localhost:19092
    ports: ["19092:19092"]

  kafka-console:
    image: redpandadata/console:v2.7.2
    environment:
      KAFKA_BROKERS: kafka:9092
    ports: ["8080:8080"]
    depends_on: [kafka]

  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports: ["16686:16686", "4317:4317", "4318:4318"]

  grafana:
    image: grafana/grafana:11.3.0
    ports: ["3002:3000"]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"

volumes:
  pgdata:
